<style>
/* Concept: a phone-first dark menu, photo tiles in a 3-column grid under a brush-script cover, like a cafe's wall board. Amber is the only accent. */
:root{
  --bg:#0E0F12;
  --surface:#17191E;
  --surface2:#20232A;
  --ink:#F5F1EA;
  --mute:#A9A59C;
  --line:#2C2F37;
  --accent:#FF9A1F;
  --on-accent:#1A1000;
  --script:'Kaushan Script','Brush Script MT',cursive;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'DejaVu Sans Mono',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));box-shadow:0 0 0 1px var(--line)}
.view{display:none}.view.on{display:block;animation:vin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---- cover ---- */
.cover{position:relative;height:272px;overflow:hidden;background:
  radial-gradient(90% 120% at 82% 0%,rgba(255,154,31,.5),transparent 60%),
  radial-gradient(70% 90% at 0% 100%,rgba(190,70,20,.35),transparent 65%),
  linear-gradient(160deg,#2A1B12,#14100D 70%)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,15,18,.25),rgba(14,15,18,.1) 40%,var(--bg))}
.steam{position:absolute;right:26px;bottom:34px;width:150px;height:150px;opacity:.9;z-index:1}
.steam .cup{fill:none;stroke:#FFC46B;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.steam .sm{fill:none;stroke:#FFD79A;stroke-width:3;stroke-linecap:round;opacity:.0;animation:rise 3.6s ease-in-out infinite}
.steam .sm:nth-of-type(2){animation-delay:1.2s}.steam .sm:nth-of-type(3){animation-delay:2.4s}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}35%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
.brand{position:absolute;left:max(20px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 46px);z-index:2}
.brand h1{margin:0;font:400 58px/.9 var(--script);color:#fff;text-shadow:0 4px 22px rgba(0,0,0,.45);transform:rotate(-4deg);transform-origin:left bottom}
.brand h1 span{display:block}
.brand h1 span+span{margin-left:34px;color:var(--accent)}
.brand p{margin:20px 0 0;display:flex;align-items:center;gap:10px;font:600 11px/1 var(--mono);letter-spacing:.2em;color:#E9E2D6}
.brand p::before,.brand p::after{content:"";width:22px;height:2px;background:var(--accent)}
.langbtn{position:absolute;z-index:3;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;background:rgba(20,22,26,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);font:600 13px/1 var(--mono);letter-spacing:.06em}
.langbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}

/* ---- grid ---- */
.sec{padding:6px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;text-align:left;background:var(--surface);isolation:isolate;transition:transform .18s}
.tile:active{transform:scale(.97)}
.tile .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;padding-bottom:18px}
.tile .ph i{font-style:normal;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));transform:rotate(-8deg)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(8,8,10,.86));z-index:1}
.tile b{position:absolute;z-index:2;left:10px;right:8px;bottom:9px;font:800 13.5px/1.15 var(--body);letter-spacing:-.005em;text-shadow:0 1px 8px rgba(0,0,0,.6);overflow-wrap:anywhere}
.tile small{position:absolute;z-index:2;right:8px;top:8px;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:rgba(14,15,18,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font:600 11px/22px var(--mono);text-align:center}
.g0{background:linear-gradient(145deg,#6A3B1E,#2A180D)}.g1{background:linear-gradient(145deg,#7A2E27,#2B1110)}.g2{background:linear-gradient(145deg,#6B5420,#2A2109)}
.g3{background:linear-gradient(145deg,#2F5A3C,#10241A)}.g4{background:linear-gradient(145deg,#3B4C7A,#141B30)}.g5{background:linear-gradient(145deg,#6D3A5E,#2A1424)}
.tile.rv{opacity:0;transform:translateY(16px)}.tile.rv.in{opacity:1;transform:none;transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1)}
.note{padding:22px 20px 0;color:var(--mute);font:500 12px/1.5 var(--mono);text-align:center}

/* ---- category + search ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.back{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center}
.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.top h2{margin:0;font:800 19px/1.2 var(--body);letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.top .cnt{margin-left:auto;flex:none;font:600 12px/1 var(--mono);color:var(--mute)}
.band{position:relative;height:150px;margin:14px max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px));border-radius:22px;overflow:hidden;display:grid;place-items:center}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.band .em{font-size:68px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));transform:rotate(-8deg);position:relative;z-index:1}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(8,8,10,.45))}
.list{display:grid;gap:0;padding:4px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.row{display:flex;align-items:baseline;gap:12px;padding:15px 0;border-bottom:1px dashed var(--line)}
.row .nm{flex:1 1 auto;min-width:0;font:700 16px/1.3 var(--body);overflow-wrap:anywhere}
.row .nm small{display:block;margin-top:3px;font:600 11px/1.3 var(--mono);letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.row .pr{flex:none;font:600 15px/1.2 var(--mono);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.searchbox{display:flex;align-items:center;gap:10px;flex:1;min-width:0;height:44px;padding:0 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.searchbox svg{flex:none;width:18px;height:18px;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round}
.searchbox input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:600 16px/1 var(--body);outline:0}
.searchbox input::placeholder{color:var(--mute)}
.empty{padding:46px 24px;text-align:center;color:var(--mute)}

/* ---- bottom bar + language sheet ---- */
.bar{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,520px);display:flex;justify-content:space-around;padding:10px max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bar button{flex:1;display:grid;justify-items:center;gap:4px;padding:6px 0;border-radius:14px;color:var(--mute);font:700 11px/1.1 var(--body)}
.bar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bar button[aria-current=page]{color:var(--accent)}
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sheet[hidden]{display:none}
.sheet .box{width:min(100%,520px);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-radius:26px 26px 0 0;background:var(--surface);border:1px solid var(--line);border-bottom:0;animation:sh .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sh{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:2px 0 14px;font:800 17px/1.2 var(--body)}
.opt{width:100%;display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:8px;border-radius:16px;background:var(--surface2);border:1.5px solid transparent;text-align:left;font:700 16px/1.2 var(--body)}
.opt code{font:600 12px/1 var(--mono);color:var(--accent);width:28px}
.opt[aria-checked=true]{border-color:var(--accent)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.tile.rv{opacity:1;transform:none}}
@media(max-width:380px){.brand h1{font-size:50px}.tile b{font-size:12.5px}}
</style>

const counts=C.map((c,i)=>M.filter(m=>m[0]===i).length);

function buildGrid(){
  $('#grid').innerHTML=C.map((c,i)=>`<button class="tile rv" type="button" data-c="${i}" style="transition-delay:${Math.min(i,14)*45}ms"><span class="ph g${i%6}"><i>${c.e}</i></span><img src="foto/${c.k}.jpg" alt="" loading="lazy" onerror="this.remove()"><small>${counts[i]}</small><b></b></button>`).join('');
  const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px 60px 0px'}):null;
  $$('.tile').forEach(t=>io?io.observe(t):t.classList.add('in'));
  setTimeout(()=>$$('.tile').forEach(t=>{t.classList.add('in');setTimeout(()=>{t.classList.remove('rv');t.style.transitionDelay=''},900)}),1400);
}
function applyLang(){
  const l=L[lang];document.documentElement.lang=l;store.set('ec-menu-lang',l);
  $$('[data-i]').forEach(e=>{const v=T[e.dataset.i];if(v)e.textContent=v[lang]});
  $$('.tile').forEach(t=>t.querySelector('b').textContent=C[t.dataset.c].n[lang]);
  $('#langCode').textContent=LC[lang];$('#q').placeholder=T.ph[lang];
  $$('.back').forEach(b=>b.setAttribute('aria-label',T.back[lang]));
  document.title='Easy Cafe · '+T.home[lang];

  route();
}
function rows(list,showCat){
  return list.map(m=>`<div class="row"><div class="nm">${esc(m[1][lang])}${showCat?`<small>${esc(C[m[0]].n[lang])}</small>`:''}</div><div class="pr">${money(m[2])}</div></div>`).join('');
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show(id){$$('.view').forEach(v=>v.classList.toggle('on',v.id===id));
  const s=id==='v-search';$('#nSearch').toggleAttribute('aria-current',s);$('#nHome').toggleAttribute('aria-current',!s);
  if(s)$('#nSearch').setAttribute('aria-current','page');else $('#nHome').setAttribute('aria-current','page')}
function route(){
  const h=location.hash.slice(1);
  if(h.startsWith('c-')){const i=C.findIndex(c=>c.k===h.slice(2));if(i>-1){
    const c=C[i];show('v-cat');$('#catTitle').textContent=c.n[lang];$('#catCnt').textContent=counts[i];
    $('#catBand').className='band g'+(i%6);$('#catBand').innerHTML=`<img src="foto/${c.k}.jpg" alt="" onerror="this.remove()"><span class="em" aria-hidden="true">${c.e}</span>`;
    $('#catList').innerHTML=rows(M.filter(m=>m[0]===i),false);scrollTo(0,0);return}}
  if(h==='search'){show('v-search');runSearch();return}
  show('v-home');if(seen)scrollTo(0,homeY);
}
function runSearch(){
  const q=norm($('#q').value.trim());const out=$('#resList');
  if(!q){out.innerHTML=rows(M,true);return}
  const r=M.filter(m=>m[1].some(n=>norm(n).includes(q)));
  out.innerHTML=r.length?rows(r,true):`<div class="empty">${T.none[lang]}</div>`;
}
$('#grid').addEventListener('click',e=>{const t=e.target.closest('.tile');if(t){homeY=scrollY;seen=true;location.hash='c-'+C[t.dataset.c].k}});
$('#back1').addEventListener('click',()=>{location.hash=''});
$('#back2').addEventListener('click',()=>{location.hash=''});
$('#nHome').addEventListener('click',()=>{if(location.hash){location.hash=''}else scrollTo({top:0,behavior:'smooth'})});
$('#nSearch').addEventListener('click',()=>{if(location.hash==='#search'){$('#q').focus();return}homeY=location.hash?homeY:scrollY;seen=true;location.hash='search';setTimeout(()=>$('#q').focus(),60)});
$('#q').addEventListener('input',runSearch);
function openSheet(){$('#sheet').hidden=false;const o=$('#opts [aria-checked=true]');o&&o.focus()}
function closeSheet(){$('#sheet').hidden=true}
$('#langBtn').addEventListener('click',openSheet);$('#nLang').addEventListener('click',openSheet);
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'){closeSheet();return}const o=e.target.closest('.opt');if(o){lang=Number(o.dataset.l);closeSheet();applyLang()}});
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
addEventListener('hashchange',route);
buildGrid();lang=detect();applyLang();seen=true;
</script>
